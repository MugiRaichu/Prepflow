<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Prepflow の印。

    外の一筆 … 下の深い弧が器（受けとめる＝食）、右上へ抜けて巻く先が
               流れ（平日へ渡っていく＝flow）。線を切らないのは、作る日と
               食べる日が別々の出来事ではなくひと続きだから。
    内の波   … 器が受けている中身。輪郭だけでは「うつわ」で終わる。
    上の二筋 … 湯気。**温かいものが今ここにある**ことだけは、
               形では言えないので足した。細く薄くして、器の線を邪魔しない。

    地を朱色、線を生成りにする。線より地で目立たせる——細い線は40pxまで
    縮むと消えるが、面なら残る。形は中央の76%に収めてある。
  -->
  <rect width="512" height="512" fill="#a4483b"/>
  <g fill="none" stroke="#faf7f2" stroke-linecap="round">
    <path d="M118 168 C 118 316 178 388 256 388 C 334 388 394 316 394 168 C 394 118 330 108 306 152 C 282 196 348 226 396 172" stroke-width="36"/>
    <path d="M 166 250 C 196 214 226 286 256 250 C 286 214 316 286 346 250" stroke-width="22" opacity="0.72"/>
    <path d="M 206 128 C 232 100 206 82 220 56" stroke-width="18" opacity="0.6"/>
    <path d="M 288 122 C 314 94 288 76 302 50" stroke-width="18" opacity="0.45"/>
  </g>
</svg>
