<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    オヒツの印。**お櫃を描く。**

    お櫃とは、炊きあがったごはんを釜から移して置いておく木の器。
    木が余分な湯気を吸うので、べたつかず、固くもならない。
    **冷蔵庫に入れずに、おいしいまま置いておくための道具**——
    このアプリがやろうとしていることと、同じことを木でやっている。

    お櫃と分かる形は3つ。1つでも欠けると桶や樽に見える。
      平らな蓋   … 身より少し広い板。取っ手は小さく、ほとんど出っ張らない
      箍（たが） … 胴に1本まわる輪。木を締めている線
      すぼまり   … 下がわずかに狭い。まっすぐだとバケツになる

    描き方はアプリの中の料理の絵に合わせる（細い等幅の線・薄い台・濃さの重ね）。
    湯気は右へ傾きながら長くなる——作った日から平日へ流れていく。
  -->
  <rect width="512" height="512" fill="#8c463c"/>
  <g fill="none" stroke="#faf7f2" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <!-- 置いてある台。薄くして器を前に出す -->
    <ellipse cx="256" cy="412" rx="146" ry="26" opacity="0.28"/>
    <!-- 胴。下がわずかにすぼまる（まっすぐだとバケツになる） -->
    <path d="M162 296 L176 384 C179 402 193 412 211 412 L301 412 C319 412 333 402 336 384 L350 296"/>
    <!-- 箍（たが）。木を締めている1本 -->
    <path d="M172 348 L340 348" opacity="0.45"/>
    <!-- 蓋。**身より広い1本の線**。板であることは、はみ出す幅で言う -->
    <path d="M126 288 L386 288" stroke-width="22"/>
    <!-- つまみ。短い縦の線1本。箱にすると小さいとき潰れる -->
    <path d="M256 288 L256 262"/>
    <!-- 湯気。右へ傾きながら長くなる＝作った日から平日へ -->
    <path d="M196 230 C210 208 194 194 204 174" stroke-width="15"/>
    <path d="M270 220 C294 194 272 176 298 148" stroke-width="15" opacity="0.66"/>
    <path d="M330 232 C358 198 336 180 368 144" stroke-width="15" opacity="0.4"/>
  </g>
</svg>
