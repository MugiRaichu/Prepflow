<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    プレノラの印。**風車。**

    一度の手間が、回って何日かに分かれる——羽が4枚あって、
    どれも同じ中心から出ている。作る日は1つ、食べる日はいくつも。
    **週が回る**ことも、同じ形で言える。

    描き方は名前の字と同じ方向（細い線・生成りの地・弁柄）。
    羽は外へ向かって開き、内側の線で付け根へ戻す——
    戻す線が無いと、ただの4本の弧に見える。
  -->
  <rect width="512" height="512" fill="#faf7f2"/>
  <g fill="none" stroke="#8c463c" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 292.0 250.0 C 380.0 226.0 434.0 300.0 360.0 372.0"/>
    <path d="M 360.0 372.0 C 304.0 320.0 286.0 278.0 286.0 278.0"/>
    <path d="M 262.0 292.0 C 286.0 380.0 212.0 434.0 140.0 360.0"/>
    <path d="M 140.0 360.0 C 192.0 304.0 234.0 286.0 234.0 286.0"/>
    <path d="M 220.0 262.0 C 132.0 286.0 78.0 212.0 152.0 140.0"/>
    <path d="M 152.0 140.0 C 208.0 192.0 226.0 234.0 226.0 234.0"/>
    <path d="M 250.0 220.0 C 226.0 132.0 300.0 78.0 372.0 152.0"/>
    <path d="M 372.0 152.0 C 320.0 208.0 278.0 226.0 278.0 226.0"/>
    <circle cx="256" cy="256" r="17"/>
  </g>
</svg>
