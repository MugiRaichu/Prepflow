<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    プレノラの印。**書体と同じ方向にそろえてある**（本人指定）。

    名前の字を細い明朝にしたので、印も細くする。
    温かさは色（弁柄）が持っているので、**線は静かにするほうが釣り合う**。
      地を生成り、線を弁柄。前は逆（朱の地に白い線）で、面で主張していた
      線は細く（13）。余白を多く取り、絵は中央の6割ほどに収める

    形は「蓋が少し開いた器」。湯気は開いている左から出て、右へ流れる。

    細い線は小さくすると消える、という懸念は残る。
    いちばん見る大きさ（ホーム画面 180px）で 13/512 は約4.6px あり、消えない。
  -->
  <rect width="512" height="512" fill="#faf7f2"/>
  <g fill="none" stroke="#8c463c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- 置いてある台。薄くして器を前に出す -->
    <ellipse cx="256" cy="414" rx="148" ry="26" opacity="0.28"/>
    <!-- 胴。下がわずかにすぼまる -->
    <path d="M162 300 L176 386 C179 404 193 414 211 414 L301 414 C319 414 333 404 336 386 L350 300"/>
    <!-- 口。ここが開いている -->
    <path d="M162 300 L350 300"/>
    <!-- 箍（たが） -->
    <path d="M172 352 L340 352" opacity="0.42"/>
    <!-- 蓋。すこし持ち上がって右へずれている -->
    <path d="M198 268 L390 268" stroke-width="18"/>
    <!-- つまみ -->
    <path d="M296 268 L296 240"/>
    <!-- 湯気。開いている左から出て、右へ -->
    <path d="M178 272 C192 246 174 230 186 202" stroke-width="12"/>
    <path d="M226 236 C252 208 228 188 256 156" stroke-width="12" opacity="0.55"/>
  </g>
</svg>
