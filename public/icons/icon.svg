<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Prepflow の印。

    **地と線を入れ替えた。**前は朱色を一面に塗って白い線を太く抜いていたが、
    それは「主張する」作りで、無印良品の棚に並ぶものとは逆だった（本人指定）。
    あちらは、生成りの紙に、細い線がひとつ、まわりは何も無い。

      地   … 生成り。アプリの地色そのまま。塗りつぶさず、余白として使う
      線   … 朱1色。太さは1本ぶん（湯気だけ少し細い）。濃淡も透過も付けない

    形の意味は変えていない。
      口の線と下の弧 … 器（受けとめる＝食）
      右上へ抜ける先 … 流れ（平日へ渡っていく＝flow）。前は巻き込んでいたのを、
                     静かに抜けるだけにした。渦は装飾で、無くても意味は立つ
      上の二筋      … 湯気。温かいものが今ここにある

    **口の線を足した。**器の縁が無いと、上の二筋が目、下の弧が口に見えて、
    顔として読めてしまう（実機で確認）。まっすぐな線が1本あるだけで、
    「何かを受けている入れもの」に切り替わる。
    湯気も左右で高さを変えてある。同じ高さで並ぶと、そこがまた目に戻る。

    中の波は落とした。輪郭と湯気で足りていて、1本増えるぶんだけ落ち着かない。
  -->
  <rect width="512" height="512" fill="#faf7f2"/>
  <g fill="none" stroke="#a4483b" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M416 150 C 404 188 384 226 356 226 L 100 226 C 100 334 156 400 228 400 C 300 400 356 334 356 226"
      stroke-width="24"
    />
    <path d="M176 166 C 194 140 174 122 188 92" stroke-width="15"/>
    <path d="M262 176 C 278 154 262 138 274 112" stroke-width="15"/>
  </g>
</svg>
