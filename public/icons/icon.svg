<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Prepflow の印。**アプリの中の料理の絵（DishImage）と同じ描き方にした**（本人指定）。

    あちらの描き方はこう決まっている。
      ・細くて太さの変わらない線。丸い端、丸い角、塗りつぶさない
      ・下に共通の皿（楕円）。薄くして、載っているものを前に出す
      ・上に載るものは線が数本だけ。濃さ（1.0 → 0.7 → 0.45）で奥行きを出す

    その言語のまま、アプリの印を描く。
      皿と器 … 食。アプリの中の全部の料理と同じ皿に載っている
      湯気三筋 … 温かいものが今ここにある。**右へ傾きながら長くなる**——
                 これが flow。作った日から、平日へ流れていく
                 （三筋なのは、DishImage も要素を3つまでに抑えているから）

    太い一筆をやめた理由: あれは印の描き方で、アプリの中の絵と言葉が違っていた。
    ホーム画面と画面の中で、同じ手で描かれたものに見えるほうがいい。
  -->
  <rect width="512" height="512" fill="#a4483b"/>
  <g fill="none" stroke="#faf7f2" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- 皿。器の底に敷く。薄くして器を前に出す -->
    <ellipse cx="256" cy="374" rx="160" ry="38" opacity="0.32"/>
    <!-- 器。口の線と、受ける弧 -->
    <path d="M136 288 H376"/>
    <path d="M136 288 C136 340 189 374 256 374 C323 374 376 340 376 288"/>
    <!-- 中身。器が受けているもの -->
    <path d="M176 310 C198 296 220 324 246 311 C272 298 296 324 330 310" opacity="0.5"/>
    <!-- 湯気。右へ傾きながら長くなる＝平日へ流れていく -->
    <path d="M182 246 C196 220 180 204 190 180" stroke-width="14"/>
    <path d="M252 240 C276 210 254 190 280 158" stroke-width="14" opacity="0.66"/>
    <path d="M320 246 C352 208 328 186 366 140" stroke-width="14" opacity="0.4"/>
  </g>
</svg>
