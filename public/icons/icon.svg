<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Prepflow の印。**一筆で描く。**

    形の意味:
      下の深い弧 … 器。受けとめるもの（食）
      右上へ抜けて巻く先 … そこから平日へ流れていくもの（flow）
    線を切らないのは、作る日と食べる日が別々の出来事ではなく、
    ひと続きだから。名前の Prep と flow をそのまま1本にした。

    地を朱色、線を生成りにする。**線より地で目立たせる。**
    細い線のアイコンは40pxまで縮むと消えるが、面なら残る。

    形は中央の76%に収めてある（丸く切られるマスクの内側）。
  -->
  <rect width="512" height="512" fill="#a4483b"/>
  <path d="M118 168 C 118 316 178 388 256 388 C 334 388 394 316 394 168 C 394 118 330 108 306 152 C 282 196 348 226 396 172"
    fill="none" stroke="#faf7f2" stroke-width="38" stroke-linecap="round"/>
</svg>
