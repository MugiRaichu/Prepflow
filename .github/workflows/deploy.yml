# GitHub Pages へ公開する。
#
# スマホで常用するには HTTPS が要る（そうでないと Service Worker が動かず、
# オフラインもホーム画面への追加も成立しない）。無料で HTTPS が付くのがここ。
#
# 置かれる場所は https://<ユーザー名>.github.io/<リポジトリ名>/ なので、
# VITE_BASE にリポジトリ名を渡してビルドする。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中に新しい push が来たら、古いほうは止める
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # リポジトリ名から公開パスを組み立てる。名前を変えても直さなくてよい
      - run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
