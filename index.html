<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />

    <!-- iOS Safari: ホーム画面追加時の全画面表示 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      black-translucent にすると、iOS はステータスバーの裏まで本文を伸ばす。
      ところが実機（iPhone 17）ではビューの高さがステータスバーぶん足りず、
      本文が時刻に重なったまま、下端に 62px の届かない帯が残った。
      背景がもともと黒なので、不透明の black で見た目は変わらない。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prepflow" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

    <!--
      名前だけに使う書体（Fraunces）。

      **筆記体はやめた。**細くて流れる字は、遠目にも小さい表示にも弱く、
      名前として立たなかった。Fraunces は明朝寄りの骨格に少しふくらみが
      あり、線が太いので小さくしても残る。生成りの地と茜の印に、
      硬すぎず整った字が合う。

      **本文には使わない。**読むための文字は system-ui のままにする
      （筆記体の日本語は無いし、英数字も読みにくくなる）。
      使うのは起動画面の「Prepflow」の8文字だけ。

      オフラインで開いたときのために、端末に入っている筆記体を後ろに置く。
      Apple の Snell Roundhand、Windows の Segoe Script。
      どちらも無ければ cursive で、最後は system-ui に落ちる。
      font-display: swap なので、届かなくても起動は止まらない。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap"
    />
    <title>Prepflow</title>

    <!--
      起動画面。

      ここに直接書いてあるのは、JS も CSS も待たずに最初の描画で出したいから。
      React 側に置くと、真っ黒な画面がしばらく出てから急に本体が現れる。

      出ている間に ensureSeeded()（食材マスタの投入）が走るので、
      待ち時間を隠すという実利もある。演出のためだけに待たせてはいない。
    -->
    <style>
      #pf-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #faf7f2;
        transition:
          opacity 380ms ease,
          transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* 本体に道を譲るとき、わずかに前に出しながら消す */
      #pf-splash.is-gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #pf-splash svg {
        width: 76px;
        height: 76px;
      }
      /* 線を引く順に手が動く。リストが流れに変わる形をそのまま見せる */
      #pf-splash path {
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        animation: pf-draw 900ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #pf-splash path:nth-child(2) {
        animation-delay: 170ms;
      }
      #pf-splash path:nth-child(3) {
        animation-delay: 340ms;
      }
      #pf-splash path:nth-child(4) {
        animation-delay: 560ms;
      }
      @keyframes pf-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /*
        キャッチコピーと名前を**同じ升に重ねる。**
        縦に並べて片方を消すと、消えた瞬間にもう片方が動く。
        重ねておけば、入れ替わっても文字の位置が変わらない。
      */
      #pf-splash .pf-words {
        display: grid;
        place-items: center;
      }
      #pf-splash .pf-words > p {
        grid-area: 1 / 1;
        margin: 0;
        color: #2b2724;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
      }
      /*
        先に何のアプリかを言い、あとから名前を置く。
        名前を先に出しても、初めての人には読む手がかりが無い。
      */
      #pf-splash .pf-tagline {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.16em;
        animation:
          pf-fade 700ms ease 900ms both,
          pf-swap-out 420ms ease 1900ms forwards;
      }
      /*
        セレクタは `.pf-words > p` と同じ強さにする。
        `#pf-splash .pf-name` だけだと、上の `#pf-splash .pf-words > p` に
        font-family を上書きされて、筆記体が当たらなかった（実測）。
      */
      #pf-splash .pf-words > p.pf-name {
        font-family: 'Fraunces', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.15;
        /* 骨格が太いぶん、字間はわずかに詰める。締まって1語に見える */
        letter-spacing: -0.015em;
        /*
          字間が詰まりながら定まる。散らばった文字が1つの名前になる。
          落ち着く先は 0.12em。広いままだと「P r e p f l o w」と
          1文字ずつ読むことになり、名前として一息に読めない。
          右端の字送りぶんだけ左に寄って見えるので、その半分を戻す。
        */
        animation: pf-swap-in 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 2120ms both;
      }
      @keyframes pf-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pf-swap-out {
        to {
          opacity: 0;
          transform: translateY(-9px);
        }
      }
      /* 下から静かに出る。字間をいじる動きは、この書体では崩れて見える */
      @keyframes pf-swap-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /*
        動きが苦手な人には出さない。
        入れ替えの代わりに、2つを縦に並べて静かに置く（どちらも読める）。
      */
      @media (prefers-reduced-motion: reduce) {
        #pf-splash path {
          animation: none;
          stroke-dashoffset: 0;
        }
        #pf-splash .pf-words {
          grid-auto-flow: row;
          gap: 12px;
        }
        #pf-splash .pf-words > p {
          grid-area: auto;
          animation: none;
          opacity: 1;
          transform: none;
        }
        /* 上の transform: none のあとに、字送りぶんの寄りだけ戻す */
        #pf-splash .pf-words > p.pf-name {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <script>
      /*
        名前の筆記体を、いますぐ取りに行かせる。

        フォントは「使われた瞬間」に読み込まれる。起動画面で名前が出るのは
        2.1秒後なので、そこまで待ってから取りに行くと間に合わず、
        毎回ゴシックのまま終わっていた（実測）。ここで先に走らせる。

        届かなくても何も起きない。端末の筆記体か cursive に落ちる。
      */
      if (document.fonts && document.fonts.load) {
        document.fonts.load('600 40px Fraunces').catch(function () {});
      }
    </script>
    <div id="pf-splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" fill="none" stroke="#a4483b" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M112 152 H400" />
        <path d="M112 256 H304" />
        <path d="M112 360 H208" />
        <path d="M336 312 L384 360 L336 408" />
      </svg>
      <div class="pf-words">
        <p class="pf-tagline">食と暮らしに寄り添う。</p>
        <p class="pf-name">Prepflow</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
