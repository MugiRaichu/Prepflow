<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />

    <!-- iOS Safari: ホーム画面追加時の全画面表示 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      black-translucent にすると、iOS はステータスバーの裏まで本文を伸ばす。
      ところが実機（iPhone 17）ではビューの高さがステータスバーぶん足りず、
      本文が時刻に重なったまま、下端に 62px の届かない帯が残った。
      背景がもともと黒なので、不透明の black で見た目は変わらない。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prepflow" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

    <!--
      名前だけに使う書体（Fraunces）。

      **筆記体はやめた。**細くて流れる字は、遠目にも小さい表示にも弱く、
      名前として立たなかった。Fraunces は明朝寄りの骨格に少しふくらみが
      あり、線が太いので小さくしても残る。生成りの地と茜の印に、
      硬すぎず整った字が合う。

      **本文には使わない。**読むための文字は system-ui のままにする
      （筆記体の日本語は無いし、英数字も読みにくくなる）。
      使うのは起動画面の「Prepflow」の8文字だけ。

      オフラインで開いたときのために、端末に入っている筆記体を後ろに置く。
      Apple の Snell Roundhand、Windows の Segoe Script。
      どちらも無ければ cursive で、最後は system-ui に落ちる。
      font-display: swap なので、届かなくても起動は止まらない。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap"
    />
    <title>Prepflow</title>

    <!--
      起動画面。

      ここに直接書いてあるのは、JS も CSS も待たずに最初の描画で出したいから。
      React 側に置くと、真っ黒な画面がしばらく出てから急に本体が現れる。

      出ている間に ensureSeeded()（食材マスタの投入）が走るので、
      待ち時間を隠すという実利もある。演出のためだけに待たせてはいない。
    -->
    <style>
      #pf-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #faf7f2;
        transition:
          opacity 380ms ease,
          transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* 本体に道を譲るとき、わずかに前に出しながら消す */
      #pf-splash.is-gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #pf-splash > svg:not(#pf-bloom) {
        position: relative;
        z-index: 1;
        width: 76px;
        height: 76px;
      }
      #pf-splash .pf-words {
        position: relative;
        z-index: 1;
      }
      /* 線を引く順に手が動く。リストが流れに変わる形をそのまま見せる */
      /* 一筆なので、1本を端から端まで引く。長さは実測より多めに取る */
      #pf-splash path {
        stroke-dasharray: 1100;
        stroke-dashoffset: 1100;
        animation: pf-draw 1100ms cubic-bezier(0.3, 0.7, 0.2, 1) forwards;
      }

      @keyframes pf-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /*
        キャッチコピーと名前を**同じ升に重ねる。**
        縦に並べて片方を消すと、消えた瞬間にもう片方が動く。
        重ねておけば、入れ替わっても文字の位置が変わらない。
      */
      #pf-splash .pf-words {
        display: grid;
        place-items: center;
      }
      #pf-splash .pf-words > p {
        grid-area: 1 / 1;
        margin: 0;
        color: #2b2724;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
      }
      /*
        先に何のアプリかを言い、あとから名前を置く。
        名前を先に出しても、初めての人には読む手がかりが無い。
      */
      #pf-splash .pf-tagline {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.16em;
        animation:
          pf-fade 700ms ease 900ms both,
          pf-swap-out 420ms ease 1900ms forwards;
      }
      /*
        セレクタは `.pf-words > p` と同じ強さにする。
        `#pf-splash .pf-name` だけだと、上の `#pf-splash .pf-words > p` に
        font-family を上書きされて、筆記体が当たらなかった（実測）。
      */
      #pf-splash .pf-words > p.pf-name {
        font-family: 'Fraunces', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.15;
        /* 骨格が太いぶん、字間はわずかに詰める。締まって1語に見える */
        letter-spacing: -0.015em;
        /*
          字間が詰まりながら定まる。散らばった文字が1つの名前になる。
          落ち着く先は 0.12em。広いままだと「P r e p f l o w」と
          1文字ずつ読むことになり、名前として一息に読めない。
          右端の字送りぶんだけ左に寄って見えるので、その半分を戻す。
        */
        animation: pf-swap-in 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 2120ms both;
      }
      @keyframes pf-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pf-swap-out {
        to {
          opacity: 0;
          transform: translateY(-9px);
        }
      }
      /* 下から静かに出る。字間をいじる動きは、この書体では崩れて見える */
      @keyframes pf-swap-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /*
        花畑。名前が出たあと、中央から一筆書きの蔓が次々に立ち上がり、
        画面いっぱいの花畑になる。**アプリを開く動作そのものを「ひらく」に見せる。**

        1本1本がアイコンと同じ一筆（伸びて、先で軽く巻く）。
        **色は食材の色。**魚の青、肉の赤茶、野菜の緑、穀物の金、卵の黄、
        豆の砂色、そして茜。飾りの色は持ち込まない——この絵は食のためのもの。

        伸びきる前に本体へ渡す。**待ち時間は増やさない**——
        消えていく最中も伸び続けるので、見えるのは「ひらく」動きだけ。
      */
      #pf-bloom {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /*
        背景の透かし。**いちばん後ろに、動かさず敷く。**
        起動の絵が消えたあと何も残らないと、さっきのは何だったのか、
        という置き去りが出る。同じ柄を薄く残して、そこをつなぐ。

        濃さは 0.09。カードは自分の地色を持っているので、透かしが出るのは
        カードとカードのあいだだけになる。**文字の下には来ない。**
      */
      #pf-watermark {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.09;
        pointer-events: none;
        z-index: 0;
      }
      #root {
        position: relative;
        z-index: 1;
      }

      /*
        起動の絵。**開くたびに変わる。**

        毎日開くものなので、同じ演出が毎回だと3日で飽きる。
        10種類を用意して、起動のたびにどれかを出す。

        分け方は「形」ではなく**動きの種類**にした。形だけ変えても、
        同じ向きに同じ速さで出てくるものは同じ絵に見える。
        伸びる・散る・降る・昇る・またたく・弾む、で分けてある。

        どれも**地の生成りに薄く重ねる**（0.5前後）。名前と印の上を
        通るので、濃く乗せると Prepflow が読めなくなる。
      */
      /*
        動きは6つ。**形ではなく動きで分ける**——形だけ変えても、同じ向きに
        同じ速さで出るものは同じ絵に見える。

        奥行きを3層に分けてある（far / mid / near）。遠いものは小さく・遅く・
        ぼかして薄く、近いものは大きく・速く・くっきり。**視差で「景色」に見せる。**
        全部が同じ速さで動くと、紙吹雪にしか見えない。
      */
      #pf-bloom .far {
        filter: blur(1.6px);
        animation-duration: 5200ms;
      }
      #pf-bloom .mid {
        animation-duration: 3800ms;
      }
      #pf-bloom .near {
        animation-duration: 2600ms;
      }

      #pf-bloom .m-grow {
        fill: none;
        stroke-linecap: round;
        opacity: 0.5;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: pf-grow 1100ms cubic-bezier(0.25, 0.7, 0.3, 1) forwards;
      }
      /* 中央（文字のまわり）から、それぞれの居場所へ散る */
      #pf-bloom .m-burst {
        opacity: 0;
        animation: pf-burst 1200ms cubic-bezier(0.16, 0.9, 0.3, 1) forwards;
      }
      /* 下からゆっくり昇る。横にも揺れる（まっすぐ昇ると煙突に見える） */
      #pf-bloom .m-rise {
        opacity: 0;
        animation: pf-rise 3400ms cubic-bezier(0.35, 0, 0.5, 1) forwards;
      }
      /* 上から降る。**左右に振れながら**落ちる。回りながら */
      #pf-bloom .m-fall {
        opacity: 0;
        animation: pf-fall 4200ms linear forwards;
      }
      /* その場でふくらむ。少し戻ってから収まる（弾みを付ける） */
      #pf-bloom .m-pop {
        opacity: 0;
        animation: pf-pop 1000ms cubic-bezier(0.2, 1.5, 0.35, 1) forwards;
      }
      #pf-bloom .m-twinkle {
        opacity: 0;
        animation: pf-twinkle 2600ms ease-in-out infinite;
      }

      @keyframes pf-burst {
        from {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(0.15) rotate(-60deg);
        }
        45% {
          opacity: var(--o, 0.62);
        }
        70% {
          transform: translate(0, 0) scale(1.12) rotate(6deg);
        }
        to {
          opacity: var(--o, 0.62);
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
      }
      @keyframes pf-rise {
        0% {
          opacity: 0;
          transform: translate(0, var(--dy, 120px)) scale(0.65);
        }
        18% {
          opacity: var(--o, 0.5);
        }
        40% {
          transform: translate(var(--sway, 14px), calc(var(--dy, 120px) * -0.1)) scale(0.85);
        }
        70% {
          transform: translate(calc(var(--sway, 14px) * -1), calc(var(--dy, 120px) * -0.9)) scale(1.05);
        }
        88% {
          opacity: var(--o, 0.5);
        }
        100% {
          opacity: 0;
          transform: translate(0, calc(var(--dy, 120px) * -1.9)) scale(1.2);
        }
      }
      @keyframes pf-fall {
        0% {
          opacity: 0;
          transform: translate(0, var(--dy, -180px)) rotate(0deg);
        }
        12% {
          opacity: var(--o, 0.55);
        }
        30% {
          transform: translate(var(--sway, 22px), calc(var(--dy, -180px) * -0.6))
            rotate(calc(var(--rot, 300deg) * 0.3));
        }
        55% {
          transform: translate(calc(var(--sway, 22px) * -1), calc(var(--dy, -180px) * -1.6))
            rotate(calc(var(--rot, 300deg) * 0.55));
        }
        80% {
          opacity: var(--o, 0.55);
          transform: translate(var(--sway, 22px), calc(var(--dy, -180px) * -2.4))
            rotate(calc(var(--rot, 300deg) * 0.8));
        }
        100% {
          opacity: 0;
          transform: translate(0, calc(var(--dy, -180px) * -3.2)) rotate(var(--rot, 300deg));
        }
      }
      @keyframes pf-pop {
        from {
          opacity: 0;
          transform: scale(0.15);
        }
        to {
          opacity: var(--o, 0.5);
          transform: scale(1);
        }
      }
      @keyframes pf-twinkle {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(0.8);
        }
        50% {
          opacity: var(--o, 0.7);
          transform: scale(1);
        }
      }

      @keyframes pf-grow {
        to {
          stroke-dashoffset: 0;
        }
      }

      /*
        動きが苦手な人には出さない。
        入れ替えの代わりに、2つを縦に並べて静かに置く（どちらも読める）。
      */
      @media (prefers-reduced-motion: reduce) {
        #pf-splash path {
          animation: none;
          stroke-dashoffset: 0;
        }
        /* 花畑は出さない。動きが目的の絵なので、静止させても意味がない */
        #pf-bloom {
          display: none;
        }
        #pf-splash .pf-words {
          grid-auto-flow: row;
          gap: 12px;
        }
        #pf-splash .pf-words > p {
          grid-area: auto;
          animation: none;
          opacity: 1;
          transform: none;
        }
        /* 上の transform: none のあとに、字送りぶんの寄りだけ戻す */
        #pf-splash .pf-words > p.pf-name {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <!--
      背景の透かし。**起動の絵と同じ柄を、動かさずうんと薄く敷く。**
      花のエフェクトが出た日は、そのあとの画面にも花の柄が残る。
      読むものではないので、文字の邪魔をしない濃さまで落とす。
    -->
    <svg id="pf-watermark" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <script>
      /*
        名前の筆記体を、いますぐ取りに行かせる。

        フォントは「使われた瞬間」に読み込まれる。起動画面で名前が出るのは
        2.1秒後なので、そこまで待ってから取りに行くと間に合わず、
        毎回ゴシックのまま終わっていた（実測）。ここで先に走らせる。

        届かなくても何も起きない。端末の筆記体か cursive に落ちる。
      */
      if (document.fonts && document.fonts.load) {
        document.fonts.load('600 40px Fraunces').catch(function () {});
      }
    </script>
    <div id="pf-splash" aria-hidden="true">
      <!--
        名前が出たあと、中央から蔓が伸びて花が咲く。
        **アプリを開く動作そのものを「ひらく」に見せる。**
        画面いっぱいに広がりきる前に本体へ渡すので、待ち時間は増えない
        （消えていく最中も伸び続ける）。
      -->
      <svg id="pf-bloom" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <!--
        アイコンと同じ一筆。器で受けて、右上へ流れてほどける。
        起動画面とホーム画面で違う印を出さない
      -->
      <svg viewBox="0 0 512 512" fill="none" stroke="#a4483b" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M118 168 C 118 316 178 388 256 388 C 334 388 394 316 394 168 C 394 118 330 108 306 152 C 282 196 348 226 396 172" />
        <path d="M 166 250 C 196 214 226 286 256 250 C 286 214 316 286 346 250" stroke-width="22" opacity="0.72" />
        <path d="M 206 128 C 232 100 206 82 220 56" stroke-width="18" opacity="0.6" />
        <path d="M 288 122 C 314 94 288 76 302 50" stroke-width="18" opacity="0.45" />
      </svg>
      <div class="pf-words">
        <p class="pf-tagline">食と暮らしに寄り添う。</p>
        <p class="pf-name">Prepflow</p>
      </div>
    </div>
    <!--
      起動の絵と背景の透かしを作る。**本体より先に走らせる。**
      別ファイルにしてあるのは、40通りぶんの指定が index.html に入ると
      最初の描画が重くなるため。Service Worker が持つので通信は初回だけ
    -->
    <script src="/splash-theme.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
