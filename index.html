<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />

    <!-- iOS Safari: ホーム画面追加時の全画面表示 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      black-translucent にすると、iOS はステータスバーの裏まで本文を伸ばす。
      ところが実機（iPhone 17）ではビューの高さがステータスバーぶん足りず、
      本文が時刻に重なったまま、下端に 62px の届かない帯が残った。
      背景がもともと黒なので、不透明の black で見た目は変わらない。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prepflow" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

    <!--
      名前だけに使う書体（Fraunces）。

      **筆記体はやめた。**細くて流れる字は、遠目にも小さい表示にも弱く、
      名前として立たなかった。Fraunces は明朝寄りの骨格に少しふくらみが
      あり、線が太いので小さくしても残る。生成りの地と茜の印に、
      硬すぎず整った字が合う。

      **本文には使わない。**読むための文字は system-ui のままにする
      （筆記体の日本語は無いし、英数字も読みにくくなる）。
      使うのは起動画面の「Prepflow」の8文字だけ。

      オフラインで開いたときのために、端末に入っている筆記体を後ろに置く。
      Apple の Snell Roundhand、Windows の Segoe Script。
      どちらも無ければ cursive で、最後は system-ui に落ちる。
      font-display: swap なので、届かなくても起動は止まらない。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap"
    />
    <title>Prepflow</title>

    <!--
      起動画面。

      ここに直接書いてあるのは、JS も CSS も待たずに最初の描画で出したいから。
      React 側に置くと、真っ黒な画面がしばらく出てから急に本体が現れる。

      出ている間に ensureSeeded()（食材マスタの投入）が走るので、
      待ち時間を隠すという実利もある。演出のためだけに待たせてはいない。
    -->
    <style>
      #pf-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #faf7f2;
        transition:
          opacity 380ms ease,
          transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* 本体に道を譲るとき、わずかに前に出しながら消す */
      #pf-splash.is-gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #pf-splash > svg:not(#pf-bloom) {
        position: relative;
        z-index: 1;
        width: 76px;
        height: 76px;
      }
      #pf-splash .pf-words {
        position: relative;
        z-index: 1;
      }
      /* 線を引く順に手が動く。リストが流れに変わる形をそのまま見せる */
      /* 一筆なので、1本を端から端まで引く。長さは実測より多めに取る */
      #pf-splash path {
        stroke-dasharray: 1100;
        stroke-dashoffset: 1100;
        animation: pf-draw 1100ms cubic-bezier(0.3, 0.7, 0.2, 1) forwards;
      }

      @keyframes pf-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /*
        キャッチコピーと名前を**同じ升に重ねる。**
        縦に並べて片方を消すと、消えた瞬間にもう片方が動く。
        重ねておけば、入れ替わっても文字の位置が変わらない。
      */
      #pf-splash .pf-words {
        display: grid;
        place-items: center;
      }
      #pf-splash .pf-words > p {
        grid-area: 1 / 1;
        margin: 0;
        color: #2b2724;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
      }
      /*
        先に何のアプリかを言い、あとから名前を置く。
        名前を先に出しても、初めての人には読む手がかりが無い。
      */
      #pf-splash .pf-tagline {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.16em;
        animation:
          pf-fade 700ms ease 900ms both,
          pf-swap-out 420ms ease 1900ms forwards;
      }
      /*
        セレクタは `.pf-words > p` と同じ強さにする。
        `#pf-splash .pf-name` だけだと、上の `#pf-splash .pf-words > p` に
        font-family を上書きされて、筆記体が当たらなかった（実測）。
      */
      #pf-splash .pf-words > p.pf-name {
        font-family: 'Fraunces', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.15;
        /* 骨格が太いぶん、字間はわずかに詰める。締まって1語に見える */
        letter-spacing: -0.015em;
        /*
          字間が詰まりながら定まる。散らばった文字が1つの名前になる。
          落ち着く先は 0.12em。広いままだと「P r e p f l o w」と
          1文字ずつ読むことになり、名前として一息に読めない。
          右端の字送りぶんだけ左に寄って見えるので、その半分を戻す。
        */
        animation: pf-swap-in 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 2120ms both;
      }
      @keyframes pf-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pf-swap-out {
        to {
          opacity: 0;
          transform: translateY(-9px);
        }
      }
      /* 下から静かに出る。字間をいじる動きは、この書体では崩れて見える */
      @keyframes pf-swap-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /*
        花畑。名前が出たあと、中央から一筆書きの蔓が次々に立ち上がり、
        画面いっぱいの花畑になる。**アプリを開く動作そのものを「ひらく」に見せる。**

        1本1本がアイコンと同じ一筆（伸びて、先で軽く巻く）。
        **色は食材の色。**魚の青、肉の赤茶、野菜の緑、穀物の金、卵の黄、
        豆の砂色、そして茜。飾りの色は持ち込まない——この絵は食のためのもの。

        伸びきる前に本体へ渡す。**待ち時間は増やさない**——
        消えていく最中も伸び続けるので、見えるのは「ひらく」動きだけ。
      */
      #pf-bloom {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #pf-bloom .pf-vine {
        fill: none;
        stroke: #6e8b5b;
        stroke-width: 2.4;
        stroke-linecap: round;
        opacity: 0.62;
        stroke-dasharray: 620;
        stroke-dashoffset: 620;
        /* 1本ずつずらして立ち上げる。同時だと爆発に見える */
        animation: pf-grow 1600ms cubic-bezier(0.25, 0.6, 0.25, 1) forwards;
        animation-delay: calc(2350ms + var(--i) * 55ms);
      }
      #pf-bloom .pf-leaf {
        fill: #6e8b5b;
        opacity: 0;
        animation: pf-leaf-in 520ms ease forwards;
        animation-delay: calc(2800ms + var(--i) * 55ms);
      }
      #pf-bloom .pf-flower {
        opacity: 0;
        transform: scale(0.15) rotate(-40deg);
        animation: pf-bloom-in 640ms cubic-bezier(0.2, 1.35, 0.4, 1) forwards;
        animation-delay: calc(3150ms + var(--i) * 55ms);
      }
      #pf-bloom .pf-core {
        fill: #faf7f2;
        opacity: 0.85;
      }
      @keyframes pf-grow {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pf-leaf-in {
        to {
          opacity: 0.6;
        }
      }
      @keyframes pf-bloom-in {
        to {
          opacity: 0.92;
          transform: scale(1) rotate(0deg);
        }
      }

      /*
        動きが苦手な人には出さない。
        入れ替えの代わりに、2つを縦に並べて静かに置く（どちらも読める）。
      */
      @media (prefers-reduced-motion: reduce) {
        #pf-splash path {
          animation: none;
          stroke-dashoffset: 0;
        }
        /* 花畑は出さない。動きが目的の絵なので、静止させても意味がない */
        #pf-bloom {
          display: none;
        }
        #pf-splash .pf-words {
          grid-auto-flow: row;
          gap: 12px;
        }
        #pf-splash .pf-words > p {
          grid-area: auto;
          animation: none;
          opacity: 1;
          transform: none;
        }
        /* 上の transform: none のあとに、字送りぶんの寄りだけ戻す */
        #pf-splash .pf-words > p.pf-name {
          transform: none;
        }
      }
    </style>
  </head>

        毎回ゴシックのまま終わっていた（実測）。ここで先に走らせる。

        届かなくても何も起きない。端末の筆記体か cursive に落ちる。
