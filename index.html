<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />

    <!-- iOS Safari: ホーム画面追加時の全画面表示 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      ステータスバーは default（時刻とバッテリーが、地色の上にそのまま出る）。
      black-translucent は使わない。実機（iPhone 17）でビューの高さが
      ステータスバーぶん足りず、下端に 62px の届かない帯が残った。

      **どの指定にしても、上の viewport-fit=cover があるかぎり
      本文の領域は画面いっぱいに広がる。**時刻を避けるぶんは指定ではなく
      env(safe-area-inset-top) から取る（src/index.css の .pf-shell / .pf-safe-top）。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="オヒツ" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

    <!--
      名前に使う字は**書いてある**（起動画面の SVG と src/components/shared/Wordmark.tsx）。

      書体は4つ試して、4つとも戻ってきた（筆記体・Fraunces・Quicksand・Klee One）。
      どれも「誰かが作った字」で、このアプリのものではなかった（本人「もっと独自のものに」）。

      取りに行くものが無いので、**外への通信は1つも無い**。
      圏外でも見た目が変わらず、届くまで名前が出ない、という待ちも起きない。
    -->
    <title>オヒツ</title>

    <!--
      起動画面。

      ここに直接書いてあるのは、JS も CSS も待たずに最初の描画で出したいから。
      React 側に置くと、真っ黒な画面がしばらく出てから急に本体が現れる。

      出ている間に ensureSeeded()（食材マスタの投入）が走るので、
      待ち時間を隠すという実利もある。演出のためだけに待たせてはいない。
    -->
    <style>
      #pf-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #faf7f2;
        transition:
          opacity 380ms ease,
          transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* 本体に道を譲るとき、わずかに前に出しながら消す */
      #pf-splash.is-gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #pf-splash > svg:not(#pf-bloom) {
        position: relative;
        z-index: 1;
        width: 76px;
        height: 76px;
      }
      #pf-splash .pf-words {
        position: relative;
        z-index: 1;
      }
      /* 線を引く順に手が動く。リストが流れに変わる形をそのまま見せる */
      /* 一筆なので、1本を端から端まで引く。長さは実測より多めに取る */
      #pf-splash path {
        stroke-dasharray: 1100;
        stroke-dashoffset: 1100;
        animation: pfb-draw 1100ms cubic-bezier(0.3, 0.7, 0.2, 1) forwards;
      }

      @keyframes pfb-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /*
        キャッチコピーと名前を**同じ升に重ねる。**
        縦に並べて片方を消すと、消えた瞬間にもう片方が動く。
        重ねておけば、入れ替わっても文字の位置が変わらない。
      */
      #pf-splash .pf-words {
        display: grid;
        place-items: center;
      }
      #pf-splash .pf-words > p {
        grid-area: 1 / 1;
        margin: 0;
        color: #2b2724;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
      }
      /*
        先に何のアプリかを言い、あとから名前を置く。
        名前を先に出しても、初めての人には読む手がかりが無い。
      */
      #pf-splash .pf-tagline {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.16em;
        animation:
          pfb-fade 700ms ease 900ms both,
          pfb-swap-out 420ms ease 1900ms forwards;
      }
      /*
        セレクタは `.pf-words > p` と同じ強さにする。
        `#pf-splash .pf-name` だけだと、上の `#pf-splash .pf-words > p` に
        font-family を上書きされて、筆記体が当たらなかった（実測）。
      */
      #pf-splash .pf-words > p.pf-name svg {
        /* 字の絵。高さだけ決めれば、横幅は絵が持っている */
        height: 44px;
        width: auto;
      }
      #pf-splash .pf-words > p.pf-name {
        font-size: 40px;
        /*
         * **細く、広く。**太くして詰めると「立つ」が、同時に重くなる。
         * 名前は主張しなくてよく、**きれいに置いてあればいい**（本人「スマートな形に」）。
         * 太さを 600 → 400 に落とし、字間を詰めから広げに転じる。
         * 字が細いぶん、間を空けても1語のまとまりは崩れない。
         */
        /* ペンの線は細い。600 で置くと、手書きの気配を残したまま字が立つ */
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0;
        /* 字間は最後の1文字の右にも付く。そのぶん左へ寄せて、光学的に中央へ */
        text-indent: 0;
        /*
          字間が詰まりながら定まる。散らばった文字が1つの名前になる。
          落ち着く先は 0.12em。広いままだと「P r e p f l o w」と
          1文字ずつ読むことになり、名前として一息に読めない。
          右端の字送りぶんだけ左に寄って見えるので、その半分を戻す。
        */
        animation: pfb-swap-in 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 2120ms both;
      }
      @keyframes pfb-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pfb-swap-out {
        to {
          opacity: 0;
          transform: translateY(-9px);
        }
      }
      /* 下から静かに出る。字間をいじる動きは、この書体では崩れて見える */
      @keyframes pfb-swap-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /*
        花畑。名前が出たあと、中央から一筆書きの蔓が次々に立ち上がり、
        画面いっぱいの花畑になる。**アプリを開く動作そのものを「ひらく」に見せる。**

        1本1本がアイコンと同じ一筆（伸びて、先で軽く巻く）。
        **色は食材の色。**魚の青、肉の赤茶、野菜の緑、穀物の金、卵の黄、
        豆の砂色、そして茜。飾りの色は持ち込まない——この絵は食のためのもの。

        伸びきる前に本体へ渡す。**待ち時間は増やさない**——
        消えていく最中も伸び続けるので、見えるのは「ひらく」動きだけ。
      */
      #pf-bloom {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        /*
          重なったところを濃くする。**均一な塗りは冷たい。**
          版を刷り重ねたような濁りが出て、幾何の形でも温かみが残る。
        */
        mix-blend-mode: multiply;
      }

      /*
        背景の透かし。**いちばん後ろに、動かさず敷く。**
        起動の絵が消えたあと何も残らないと、さっきのは何だったのか、
        という置き去りが出る。同じ柄を薄く残して、そこをつなぐ。

        濃さは 0.09。カードは自分の地色を持っているので、透かしが出るのは
        カードとカードのあいだだけになる。**文字の下には来ない。**
      */
      #pf-watermark {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.09;
        pointer-events: none;
        z-index: 0;
      }
      #root {
        position: relative;
        z-index: 1;
      }

      /*
        起動の絵。**開くたびに変わる。**

        毎日開くものなので、同じ演出が毎回だと3日で飽きる。
        10種類を用意して、起動のたびにどれかを出す。

        分け方は「形」ではなく**動きの種類**にした。形だけ変えても、
        同じ向きに同じ速さで出てくるものは同じ絵に見える。
        伸びる・散る・降る・昇る・またたく・弾む、で分けてある。

        どれも**地の生成りに薄く重ねる**（0.5前後）。名前と印の上を
        通るので、濃く乗せると名前が読めなくなる。
      */
      /*
        動きは6つ。**形ではなく動きで分ける**——形だけ変えても、同じ向きに
        同じ速さで出るものは同じ絵に見える。

        奥行きを3層に分けてある（far / mid / near）。遠いものは小さく・遅く・
        ぼかして薄く、近いものは大きく・速く・くっきり。**視差で「景色」に見せる。**
        全部が同じ速さで動くと、紙吹雪にしか見えない。
      */
      #pf-bloom .far {
        filter: blur(1.6px);
        animation-duration: 5200ms;
      }
      #pf-bloom .mid {
        animation-duration: 3800ms;
      }
      #pf-bloom .near {
        animation-duration: 2600ms;
      }

      #pf-bloom .m-grow {
        fill: none;
        stroke-linecap: round;
        opacity: 0.5;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: pfb-grow 1100ms cubic-bezier(0.25, 0.7, 0.3, 1) forwards;
      }
      /* 中央（文字のまわり）から、それぞれの居場所へ散る */
      #pf-bloom .m-burst {
        opacity: 0;
        animation: pfb-burst 1200ms cubic-bezier(0.16, 0.9, 0.3, 1) forwards;
      }
      /* 下からゆっくり昇る。横にも揺れる（まっすぐ昇ると煙突に見える） */
      #pf-bloom .m-rise {
        opacity: 0;
        animation: pfb-rise 3400ms cubic-bezier(0.35, 0, 0.5, 1) forwards;
      }
      /* 上から降る。**左右に振れながら**落ちる。回りながら */
      #pf-bloom .m-fall {
        opacity: 0;
        animation: pfb-fall 4200ms linear forwards;
      }
      /* その場でふくらむ。少し戻ってから収まる（弾みを付ける） */
      #pf-bloom .m-pop {
        opacity: 0;
        animation: pfb-pop 1000ms cubic-bezier(0.2, 1.5, 0.35, 1) forwards;
      }
      #pf-bloom .m-twinkle {
        opacity: 0;
        animation: pfb-twinkle 2600ms ease-in-out infinite;
      }

      @keyframes pfb-burst {
        from {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(0.15) rotate(-60deg);
        }
        45% {
          opacity: var(--o, 0.62);
        }
        70% {
          transform: translate(0, 0) scale(1.12) rotate(6deg);
        }
        to {
          opacity: var(--o, 0.62);
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
      }
      @keyframes pfb-rise {
        0% {
          opacity: 0;
          transform: translate(0, var(--dy, 120px)) scale(0.65);
        }
        18% {
          opacity: var(--o, 0.5);
        }
        40% {
          transform: translate(var(--sway, 14px), calc(var(--dy, 120px) * -0.1)) scale(0.85);
        }
        70% {
          transform: translate(calc(var(--sway, 14px) * -1), calc(var(--dy, 120px) * -0.9)) scale(1.05);
        }
        88% {
          opacity: var(--o, 0.5);
        }
        100% {
          opacity: 0;
          transform: translate(0, calc(var(--dy, 120px) * -1.9)) scale(1.2);
        }
      }
      @keyframes pfb-fall {
        0% {
          opacity: 0;
          transform: translate(0, var(--dy, -180px)) rotate(0deg);
        }
        12% {
          opacity: var(--o, 0.55);
        }
        30% {
          transform: translate(var(--sway, 22px), calc(var(--dy, -180px) * -0.6))
            rotate(calc(var(--rot, 300deg) * 0.3));
        }
        55% {
          transform: translate(calc(var(--sway, 22px) * -1), calc(var(--dy, -180px) * -1.6))
            rotate(calc(var(--rot, 300deg) * 0.55));
        }
        80% {
          opacity: var(--o, 0.55);
          transform: translate(var(--sway, 22px), calc(var(--dy, -180px) * -2.4))
            rotate(calc(var(--rot, 300deg) * 0.8));
        }
        100% {
          opacity: 0;
          transform: translate(0, calc(var(--dy, -180px) * -3.2)) rotate(var(--rot, 300deg));
        }
      }
      @keyframes pfb-pop {
        from {
          opacity: 0;
          transform: scale(0.15);
        }
        to {
          opacity: var(--o, 0.5);
          transform: scale(1);
        }
      }
      /*
        風。**横へ流される動き。**

        降る・昇るは縦の動きで、風は横。ひと吹きで持っていかれて、
        ゆるんで、また吹く——という強弱を1つの動きの中に入れてある
        （等速で流すと、ベルトコンベアに見える）。
        奥のものほど遅く、手前ほど速い（far / mid / near）。
      */
      #pf-bloom .m-wind {
        opacity: 0;
        animation: pfb-wind 4600ms cubic-bezier(0.35, 0, 0.5, 1) forwards;
      }
      @keyframes pfb-wind {
        0% {
          opacity: 0;
          transform: translate(var(--dx, -260px), 0) rotate(0deg);
        }
        12% {
          opacity: var(--o, 0.55);
        }
        /* ひと吹き目。勢いよく流される */
        38% {
          transform: translate(calc(var(--dx, -260px) * 0.35), var(--sway, 16px))
            rotate(calc(var(--rot, 220deg) * 0.4));
        }
        /* ゆるむ。少し戻って舞い上がる */
        56% {
          transform: translate(calc(var(--dx, -260px) * 0.2), calc(var(--sway, 16px) * -1.2))
            rotate(calc(var(--rot, 220deg) * 0.55));
        }
        88% {
          opacity: var(--o, 0.55);
        }
        /* ふた吹き目で画面の外へ */
        100% {
          opacity: 0;
          transform: translate(calc(var(--dx, -260px) * -1.3), var(--sway, 16px))
            rotate(var(--rot, 220deg));
        }
      }

      @keyframes pfb-twinkle {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(0.8);
        }
        50% {
          opacity: var(--o, 0.7);
          transform: scale(1);
        }
      }

      @keyframes pfb-grow {
        to {
          stroke-dashoffset: 0;
        }
      }

      /*
        動きが苦手な人には出さない。
        入れ替えの代わりに、2つを縦に並べて静かに置く（どちらも読める）。
      */
      @media (prefers-reduced-motion: reduce) {
        #pf-splash path {
          animation: none;
          stroke-dashoffset: 0;
        }
        /* 花畑は出さない。動きが目的の絵なので、静止させても意味がない */
        #pf-bloom {
          display: none;
        }
        #pf-splash .pf-words {
          grid-auto-flow: row;
          gap: 12px;
        }
        #pf-splash .pf-words > p {
          grid-area: auto;
          animation: none;
          opacity: 1;
          transform: none;
        }
        /* 上の transform: none のあとに、字送りぶんの寄りだけ戻す */
        #pf-splash .pf-words > p.pf-name {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <!--
      背景の透かし。**起動の絵と同じ柄を、動かさずうんと薄く敷く。**
      花のエフェクトが出た日は、そのあとの画面にも花の柄が残る。
      読むものではないので、文字の邪魔をしない濃さまで落とす。
    -->
    <svg id="pf-watermark" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <script>
      /*
        名前の筆記体を、いますぐ取りに行かせる。

        名前は字の絵なので、読み込むものが無い。
        先に読ませる仕掛けも要らなくなった。
      */
    </script>
    <div id="pf-splash" aria-hidden="true">
      <!--
        名前が出たあと、中央から蔓が伸びて花が咲く。
        **アプリを開く動作そのものを「ひらく」に見せる。**
        画面いっぱいに広がりきる前に本体へ渡すので、待ち時間は増えない
        （消えていく最中も伸び続ける）。
      -->
      <svg id="pf-bloom" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <!--
        アイコンと同じ一筆。器で受けて、右上へ流れてほどける。
        起動画面とホーム画面で違う印を出さない
      -->
      <svg viewBox="0 0 512 512" fill="none" stroke="#8c463c" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="256" cy="414" rx="146" ry="26" opacity="0.28"/>
        <!-- 胴。下がわずかにすぼまる（まっすぐだとバケツになる） -->
        <path d="M162 300 L176 386 C179 404 193 414 211 414 L301 414 C319 414 333 404 336 386 L350 300"/>
        <!-- 口。ここが開いている -->
        <path d="M162 300 L350 300"/>
        <!-- 箍（たが）。木を締めている1本 -->
        <path d="M172 352 L340 352" opacity="0.45"/>
        <!--
      蓋。**すこし持ち上がって、右へずれている。**左が開いていて、そこから湯気が出る。
      閉まっていると、湯気がどこから出ているのか説明が付かない。

      **傾けない。**一度斜めにしたら「ずり落ちた」ように見えた。
      **縁と同じ高さにも置かない。**線が重なって1本になり、開いていることが消える。
      持ち上げて隙間を作るのが、いちばん短く伝わる（どれも実測）
    -->
        <path d="M198 268 L390 268" stroke-width="22"/>
        <!-- つまみ。蓋の真ん中に短く -->
        <path d="M296 268 L296 240"/>
        <!-- 湯気。**開いている左から出て**、右へ流れていく -->
        <path d="M178 272 C192 246 174 230 186 202" stroke-width="15"/>
        <path d="M226 236 C252 208 228 188 256 156" stroke-width="15" opacity="0.6"/>
      </svg>
      <div class="pf-words">
        <p class="pf-tagline">食と暮らしに寄り添う。</p>
        <p class="pf-name">
          <svg viewBox="0 0 354 140" aria-label="Ohitsu" role="img"
            fill="none" stroke="currentColor" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round">
        <path d="M 66.5 24.2 A 34 44 0 1 0 79.6 34.3" />
        <path d="M 106 20 L 106 110" />
        <path d="M 106 68 C 112 50 140 50 144 68 L 144 110" />
        <path d="M 164 52 L 164 110" />
        <path d="M 161 36 C 169 29 160 24 168 16" stroke-width="11" />
        <path d="M 194 30 L 194 94 C 194 114 208 112 214 104" />
        <path d="M 180 52 L 212 52" stroke-width="12" />
        <path d="M 276 62 C 270 49 240 49 238 68 C 236 93 276 85 274 92" />
        <path d="M 274 92 C 270 113 244 113 236 100" />
        <path d="M 294 52 L 294 92 C 294 113 332 113 332 92 L 332 52" />
        <path d="M 332 52 L 332 110" />
          </svg>
        </p>
      </div>
    </div>
    <!--
      起動の絵と背景の透かしを作る。**本体より先に走らせる。**
      別ファイルにしてあるのは、40通りぶんの指定が index.html に入ると
      最初の描画が重くなるため。Service Worker が持つので通信は初回だけ
    -->
    <script src="/splash-theme.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      **白い画面のまま置かない。**最後の砦。

      アプリの中で落ちたぶんは React 側で受け止めている（ErrorBoundary）。
      だがそこへ**辿り着く前**に止まると、受け止める人がいない——
      本体の読み込みが 404 になる、通信が途中で切れる、
      入れ替わった Service Worker が古い組み合わせを返す、など。
      そのときはこの素の HTML だけが動く。だから出口もここに置く。

      判定は「#root に何か描かれたか」だけ。10秒経っても空なら、止まっている。

      直し方を2つ出す。**どちらもデータは消えない**（献立も設定も IndexedDB にあり、
      ここで触るのは読み込み用の一時ファイルだけ）。
    -->
    <script>
      (function () {
        var WAIT_MS = 10000;
        var shown = false;

        function panel(title, note) {
          if (shown) return;
          shown = true;
          var splash = document.getElementById('pf-splash');
          if (splash) splash.remove();

          var wrap = document.createElement('div');
          wrap.setAttribute(
            'style',
            'position:fixed;inset:0;z-index:10000;overflow:auto;' +
              'background:#faf7f2;color:#2b2724;' +
              'font:15px/1.7 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;' +
              'padding:calc(env(safe-area-inset-top) + 24px) 24px 24px;'
          );

          var box = document.createElement('div');
          box.setAttribute('style', 'max-width:26rem;margin:0 auto');

          var h = document.createElement('h1');
          h.setAttribute('style', 'font-size:20px;font-weight:600;margin:0 0 12px');
          h.textContent = title;

          var p = document.createElement('p');
          p.setAttribute('style', 'margin:0 0 20px;color:#6b635c');
          p.textContent = note;

          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(
            button('開き直す', '#2b2724', '#faf7f2', function () {
              location.reload();
            })
          );
          box.appendChild(
            button('アプリを入れ直す', 'transparent', '#2b2724', function () {
              reinstall();
            })
          );

          var small = document.createElement('p');
          small.setAttribute('style', 'margin:12px 0 0;font-size:13px;color:#6b635c');
          small.textContent =
            '「入れ直す」を押しても、献立・設定・買い出しの記録は消えません。' +
            '読み込み用の一時ファイルだけを捨てて、もう一度取り直します。';
          box.appendChild(small);

          wrap.appendChild(box);
          document.body.appendChild(wrap);
        }

        function button(label, bg, fg, onClick) {
          var b = document.createElement('button');
          b.textContent = label;
          b.setAttribute(
            'style',
            'display:block;width:100%;min-height:48px;margin-bottom:10px;' +
              'border-radius:10px;border:1px solid #2b2724;cursor:pointer;' +
              'font:inherit;font-weight:600;background:' + bg + ';color:' + fg
          );
          b.onclick = onClick;
          return b;
        }

        /*
          読み込み用の一時ファイルだけを捨てる。
          IndexedDB（献立・設定・レシピ）には触らない
        */
        function reinstall() {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(
                  rs.map(function (r) {
                    return r.unregister();
                  })
                );
              })
            );
          }
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys().then(function (ks) {
                return Promise.all(
                  ks.map(function (k) {
                    return caches.delete(k);
                  })
                );
              })
            );
          }
          Promise.all(jobs)
            ['catch'](function () {})
            .then(function () {
              location.replace(location.pathname + location.search);
            });
        }

        /*
          本体の読み込みそのものが失敗したときは、待たずに出す。
          ただし**まだ何も描けていないときだけ**——動き出したあとに
          あとから読むファイルが1つ落ちても、画面ごと差し替えては困る
          （そこは React 側の受け止めに任せる）。
        */
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              panel('アプリを読み込めませんでした', '本体のファイルが取得できませんでした。');
            }
          },
          true
        );

        /*
          **まず黙って直してみる。**

          止まる原因のほとんどは、入れ替えに失敗した Service Worker が
          古い組み合わせを返していること。捨てて取り直せば直る。
          そこまで自動でやれば、多くの人はそもそも何も見ずに済む。

          ただし**1回だけ**。sessionStorage に印を付け、
          もう一度止まったときは自動で繰り返さず、画面に出して人に渡す
          （繰り返すと、開き直しの無限ループになる）。
        */
        var HEALED = 'pf-healed';

        function healedAlready() {
          try {
            return sessionStorage.getItem(HEALED) === '1';
          } catch (e) {
            return true; // 印を残せない環境では自動で直さない
          }
        }

        function markHealed() {
          try {
            sessionStorage.setItem(HEALED, '1');
          } catch (e) {}
        }

        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          if (!healedAlready()) {
            markHealed();
            reinstall();
            return;
          }
          panel(
            'アプリを開けませんでした',
            '読み込みの途中で止まりました。記録したものは残っています。'
          );
        }, WAIT_MS);
      })();
    </script>
  </body>
</html>
